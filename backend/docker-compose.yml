services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mccs
      POSTGRES_PASSWORD: mccs
      POSTGRES_DB: mccs
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: